events {
    worker_connections 4096;
}

http {

    # 1. DEFINE ZONES (Shared memory for tracking IPs)
    # ------------------------------------------------
    # Tracks the number of open connections per IP (10MB stores ~160,000 IPs)
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    
    # Tracks the rate of requests per IP (10MB stores ~160,000 IPs)
    limit_req_zone $binary_remote_addr zone=req_limit:10m rate=10r/s;

    # 2. SLOWLORIS & BUFFER OVERFLOW PROTECTION
    # ------------------------------------------------
    # Drop connections if a client takes too long to send headers or body
    client_header_timeout 10s;
    client_body_timeout 10s;
    
    # Drop connections if the server takes too long to send data back
    send_timeout 10s;
    
    # Prevent massive payloads from crashing memory
    client_max_body_size 2M;
    client_body_buffer_size 128k;





    server {
        listen 80;
        # 3. APPLY LIMITS TO THE SERVER BLOCK
        # ------------------------------------------------
        # Max 10 concurrent connections from a single IP address
        limit_conn conn_limit 10;
        
        # Leaky Bucket: Allow bursts of up to 20 requests, but process them without delay
        limit_req zone=req_limit burst=20 nodelay;

        # Return a custom 429 status code instead of the default 503 when limits hit
        limit_req_status 429;
        limit_conn_status 429;









        # 1. API Traffic is handed off to Kong
        location /api/ {
            # Kong runs on port 8000 inside the Docker network
            proxy_pass http://kong:8000; 
            # proxy_pass: This is the magic command. It tells NGINX, "Don't try to answer this request yourself. Secretly forward it to the server at http://kong:8000, wait for Kong's answer, and then pass that answer back to the user." The user never knows Kong exists; they only see NGINX.
            proxy_set_header Host $host; 
            #Because NGINX is acting as a middleman, the backend (Kong) will think every request is coming from NGINX. These lines take the original user's IP address and attach it to the request so Kong knows who the actual user is.
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 2. Base traffic (Placeholder for your future frontend)
        location / {
            return 200 'NGINX Edge Proxy is running! Send requests to /api/...';
            add_header Content-Type text/plain;
        }
    }
}