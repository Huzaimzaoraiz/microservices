services:
  # 1. API Gateway
  nginx:
    image: nginx:alpine
    container_name: api_gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - ecommerce_bridge
    depends_on:
      - kong
      - kafka
      - redis
      - postgres
      - mongodb

  # 2. Relational Database (For User, Order, Payment Services)
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: postgres # default maintenance DB, not used directly
      POSTGRES_MULTIPLE_DATABASES: user_service_db,order_service_db,payment_service_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init/init-multi-db.sh:/docker-entrypoint-initdb.d/init-multi-db.sh
    networks:
      - ecommerce_bridge

  # 3. NoSQL Database (For Product Catalog Service)
  mongodb:
    image: mongo:latest
    container_name: mongodb_db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin_password
    volumes:
      - mongo_data:/data/db
    networks:
      - ecommerce_bridge

  # 4. Cache & Rate Limiting
  redis:
    image: redis:alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ecommerce_bridge

  kafka:
    image: bitnamilegacy/kafka:4.0.0-debian-12-r10
    container_name: kafka_broker
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      # Modern 4.x KRaft settings
      - KAFKA_CFG_CONTROLLER_QUORUM_BOOTSTRAP_SERVERS=kafka:9093
      - KAFKA_KRAFT_CLUSTER_ID=abcdefghijklmnopqrstuv
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - ecommerce_bridge

  kong:
    image: kong:latest
    container_name: kong_gateway
    environment:
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/etc/kong/kong.yml
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_ADMIN_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_ERROR_LOG=/dev/stderr
      - KONG_PROXY_LISTEN=0.0.0.0:8000
      - KONG_ADMIN_LISTEN=0.0.0.0:8001
    ports:
      - "8000:8000" # Proxy port (Where API traffic enters)
      - "8001:8001" # Admin port (To view Kong's status)
    volumes:
      - ./kong.yml:/etc/kong/kong.yml:ro
    networks:
      - ecommerce_bridge
  user_service:
    build:
      context: ./services-be/user-service # Path to your Node.js folder
    container_name: user_service
    ports:
      - "3000:3000"
    environment:
      # Notice we use 'postgres' as the host, not localhost!
      - DATABASE_URL_USER_SERVICE=postgresql://admin:admin_password@postgres:5432/user_service_db
      - JWT_SECRET=jwt_secret
    volumes:
      - ./services-be/user-service:/app
      - /app/node_modules
    networks:
      - ecommerce_bridge
    depends_on:
      - postgres
  catalog_service:
    build:
      context: ./services-be/catalog-service # Path to your Node.js folder
    container_name: catalog_service
    ports:
      - "9000:9000"
    environment:
      - MONGO_URI=mongodb://admin:admin_password@mongodb:27017/catalog_service_db?authSource=admin
    volumes:
      - ./services-be/catalog-service:/app
      - /app/node_modules
    networks:
      - ecommerce_bridge
    depends_on:
      - mongodb

# Define the custom bridge network
networks:
  ecommerce_bridge:
    driver: bridge

# Define persistent storage volumes
volumes:
  postgres_data:
  mongo_data:
  redis_data:
  kafka_data:
